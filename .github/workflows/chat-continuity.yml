name: Chat continuity regression
on:
  push:
    branches:
      - fix/chat-continuity-safe-20260924
  pull_request:
    paths:
      - worker/scenario.ts
      - worker/index.ts
      - src/App.tsx
      - src/styles.css
      - src/types.ts
      - tests/conversation-ack.test.mjs
      - package.json
      - tools/chat-continuity-visual-qa.mjs
      - .github/workflows/chat-continuity.yml
jobs:
  test-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build

  mobile-visual:
    needs: test-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Install Chromium and WebKit
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Verify six mocked mobile states
        run: node tools/chat-continuity-visual-qa.mjs
      - name: Save screenshots and QA verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chat-continuity-mobile-qa
          path: qa-output/
          if-no-files-found: warn
          retention-days: 7
