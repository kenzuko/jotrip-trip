name: JoTrip iPhone Live Visual QA

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/iphone-live-visual-qa.yml
      - tools/iphone-live-visual-qa.mjs
  workflow_dispatch:

jobs:
  iphone-live-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test browsers
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Test real Cloudflare homepage at iPhone sizes
        run: node tools/iphone-live-visual-qa.mjs
      - name: Save screenshots and JSON results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-warm-island-live-qa
          path: qa-output/
          if-no-files-found: warn
          retention-days: 7
