name: Cloudflare D1 read-only preflight

on:
  push:
    branches:
      - feat/living-trip-v2-20260926
    paths:
      - ".github/workflows/cloudflare-d1-readonly-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    # Never execute from a fork or PR. Read-only table inspection, never customer rows.
    if: github.repository == 'kenzuko/jotrip-trip' && github.ref == 'refs/heads/feat/living-trip-v2-20260926'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      EXPECTED_D1_ID: "17372bb5-7626-4238-8a95-fc0cf31ad18e"
    steps:
      - uses: actions/checkout@v4
      - name: Check scoped Cloudflare credential availability
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Cloudflare API token or account ID is unavailable in jotrip-trip Actions secrets/variables. No remote D1 request was made."
            exit 2
          fi
          echo "Cloudflare credentials are available; no secret values will be printed."
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned project dependencies
        run: npm install --no-audit --no-fund
      - name: Confirm remote D1 identity without printing customer data
        shell: bash
        run: |
          npx wrangler d1 info jotrip-trip-db --json > /tmp/jotrip-d1-info.json
          if ! grep -Fq "$EXPECTED_D1_ID" /tmp/jotrip-d1-info.json; then
            echo "::error::Remote D1 identity does not match reviewed wrangler.jsonc; stopping."
            exit 3
          fi
          echo "Remote D1 identity matches reviewed UUID."
      - name: Inspect remote migration history (read-only)
        run: npx wrangler d1 migrations list jotrip-trip-db --remote
      - name: Inventory remote table names only (no data or schema dump)
        shell: bash
        run: |
          npx wrangler d1 execute jotrip-trip-db --remote --json --command "SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' ORDER BY name" > /tmp/jotrip-d1-tables.json
          node --input-type=module -e 'import fs from "node:fs"; const a=JSON.parse(fs.readFileSync("/tmp/jotrip-d1-tables.json","utf8")); const rows=(Array.isArray(a)?a:[a]).flatMap(x=>x.results??[]); if(!rows.every(x=>typeof x.name==="string"))process.exit(2); console.log("Remote table inventory:",JSON.stringify(rows.map(x=>x.name)));'
          rm -f /tmp/jotrip-d1-tables.json
      - name: Count legacy rows and applied migration records only (no customer fields)
        shell: bash
        run: |
          npx wrangler d1 execute jotrip-trip-db --remote --json --command "SELECT (SELECT COUNT(*) FROM d1_migrations) AS migration_records, (SELECT COUNT(*) FROM chat_messages) AS chat_messages, (SELECT COUNT(*) FROM trips) AS trips, (SELECT COUNT(*) FROM users) AS users, (SELECT COUNT(*) FROM hotel_private_rates) AS private_hotel_rates" > /tmp/jotrip-d1-counts.json
          node --input-type=module -e 'import fs from "node:fs"; const a=JSON.parse(fs.readFileSync("/tmp/jotrip-d1-counts.json","utf8")); const rows=(Array.isArray(a)?a:[a]).flatMap(x=>x.results??[]); if(rows.length!==1||!Object.values(rows[0]).every(x=>Number.isSafeInteger(x)&&x>=0))process.exit(2); console.log("Read-only legacy row counts:",JSON.stringify(rows[0]));'
          rm -f /tmp/jotrip-d1-counts.json
      - name: Inspect allowlisted remote table definitions (read-only, no customer rows)
        shell: bash
        run: |
          npx wrangler d1 execute jotrip-trip-db --remote --json --command "SELECT name, sql FROM sqlite_master WHERE type='table' AND name IN ('booking_leads','trip_sessions_v2','trip_turns_v2','trip_deleted_sessions_v2','booking_lead_consents_v2','booking_lead_erasure_audit','d1_migrations') ORDER BY name" > /tmp/jotrip-d1-table-definitions.json
          node tools/d1-schema-from-wrangler.mjs /tmp/jotrip-d1-table-definitions.json /tmp/jotrip-d1-schema.sql
          node tools/d1-schema-preflight.mjs /tmp/jotrip-d1-schema.sql
          rm -f /tmp/jotrip-d1-table-definitions.json /tmp/jotrip-d1-schema.sql /tmp/jotrip-d1-info.json
      - name: Diagnose active token identity and safe alternate (no token values logged)
        shell: bash
        env:
          PRIMARY_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FALLBACK_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          set -euo pipefail
          echo "Primary CLOUDFLARE_API_TOKEN present: $([[ -n "$PRIMARY_TOKEN" ]] && echo yes || echo no)"
          echo "Fallback CF_API_TOKEN present: $([[ -n "$FALLBACK_TOKEN" ]] && echo yes || echo no)"
          if [[ -n "$PRIMARY_TOKEN" && -n "$FALLBACK_TOKEN" ]]; then
            echo "Two configured token values are identical: $([[ "$PRIMARY_TOKEN" == "$FALLBACK_TOKEN" ]] && echo yes || echo no)"
          fi
          for label in primary fallback; do
            token="$PRIMARY_TOKEN"
            [[ "$label" == fallback ]] && token="$FALLBACK_TOKEN"
            [[ -z "$token" ]] && continue
            if curl --fail --silent --show-error --max-time 15 -H "Authorization: Bearer $token" https://api.cloudflare.com/client/v4/user/tokens/verify > "/tmp/trip-verify-$label.json" 2>/dev/null; then
              LABEL="$label" node --input-type=module -e 'import fs from "node:fs"; import crypto from "node:crypto";const x=JSON.parse(fs.readFileSync("/tmp/trip-verify-"+process.env.LABEL+".json","utf8"));if(!x.success||!x.result?.id)process.exit(2);console.log(process.env.LABEL+" token active: "+x.result.status+"; token ID comparison hash: "+crypto.createHash("sha256").update(x.result.id).digest("hex").slice(0,16));'
            else
              echo "$label token verification endpoint unavailable (not proof of invalid token)."
            fi
            rm -f "/tmp/trip-verify-$label.json"
          done
      - name: Verify remote D1 schema export with configured tokens (no customer data)
        shell: bash
        env:
          PRIMARY_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FALLBACK_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f /tmp/jotrip-d1-schema-export.sql /tmp/jotrip-d1-export.log' EXIT
          for label in primary fallback; do
            token="$PRIMARY_TOKEN"
            [[ "$label" == fallback ]] && token="$FALLBACK_TOKEN"
            [[ -z "$token" ]] && continue
            if [[ "$label" == fallback && "$token" == "$PRIMARY_TOKEN" ]]; then
              echo "Fallback is identical to primary; skipping duplicate export."
              continue
            fi
            export CLOUDFLARE_API_TOKEN="$token"
            if npx wrangler d1 export jotrip-trip-db --remote --no-data --output=/tmp/jotrip-d1-schema-export.sql > /tmp/jotrip-d1-export.log 2>&1; then
              echo "$label token: D1 schema-only export succeeded."
              node tools/d1-schema-preflight.mjs /tmp/jotrip-d1-schema-export.sql
              exit 0
            fi
            echo "$label token: D1 schema-only export failed. Sanitized error codes:"
            grep -oE 'code: [0-9]+' /tmp/jotrip-d1-export.log | sort -u || true
            rm -f /tmp/jotrip-d1-schema-export.sql /tmp/jotrip-d1-export.log
          done
          echo "::error::Neither configured token can export the schema; no customer data was downloaded."
          exit 1
      - name: Safety statement
        run: |
          echo "Read-only table inspection complete. Full D1 export/backup remains a separate permission gate. No migration, Worker deploy, DNS change or remote mutation occurred."
