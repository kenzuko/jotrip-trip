name: Living Trip V2 checks

on:
  push:
    branches:
      - feat/living-trip-v2-20260926
  pull_request:
    paths:
      - "src/**"
      - "worker/**"
      - "tests/**"
      - "migrations/**"
      - "wrangler.jsonc"
      - "package.json"
      - ".github/workflows/living-trip-v2-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies (repository has no lockfile yet)
        run: npm install --no-audit --no-fund
      - name: Strict typecheck of new V2 modules (legacy type debt tracked in handoff)
        run: npx tsc --noEmit -p tsconfig.v2.json
      - name: Unit and integration tests
        run: npm test
      - name: Real local D1 schema and lifecycle smoke (never remote)
        run: |
          npx wrangler d1 execute jotrip-trip-db --local --persist-to /tmp/jotrip-v2-d1 --file migrations/0009_trip_turn_state.sql
          npx wrangler d1 execute jotrip-trip-db --local --persist-to /tmp/jotrip-v2-d1 --file tests/fixtures/v2-d1-smoke.sql
          npx wrangler d1 execute jotrip-trip-db --local --persist-to /tmp/jotrip-v2-d1 --file migrations/0010_booking_lead_privacy.sql
          npx wrangler d1 execute jotrip-trip-db --local --persist-to /tmp/jotrip-v2-d1 --file tests/fixtures/v2-booking-lead-smoke.sql
      - name: Build production assets
        run: npm run build
      - name: Wrangler validation only (never deploy)
        run: npx wrangler deploy --dry-run
